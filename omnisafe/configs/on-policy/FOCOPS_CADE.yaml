    # advantage estimation method, options: gae, gae-rtg, vtrace, plain and subm
#    adv_estimation_method: gae
#    adv_estimation_method: gae-rtg
#    adv_estimation_method: vtrace
#    adv_estimation_method: plain
    adv_estimation_method: subm
    # standardize reward advantage
    standardized_rew_adv: True
    # standardize cost advantage
    standardized_cost_adv: False
    # episode mean sliding window size
#    ep_ret_window_size: 10
    ep_ret_window_size: 20
#    ep_ret_window_size: 15
#    ep_ret_window_size: 30
#    ep_ret_window_size: 5
    # penalty coefficient
    penalty_coef: 0.0
    # use cost
    use_cost: True
    # use lagrangian in advantage calculation
    use_lagrangian: False
    # use semantic dynamics model
    use_sdm: True
    # use sdm-based safety layer
    use_safety_layer: False
    # whether rank sampled actions with tradeoff score of reward and cost
    safety_layer_use_reward: False
    # use episode-wise MPC-informed Lagrangian multiplier update
    use_mpc_lagrangian: False
  # logger configurations
  logger_cfgs:
    # use wandb for logging
    use_wandb: True
    # wandb project name
    wandb_project: cade-sre-medium-discrete-action-space
    # use tensorboard for logging
    use_tensorboard: True
    # save model frequency
    save_model_freq: 50
    # save logger path
    log_dir: "./runs"
    # save model path
    window_lens: 100
  # model configurations
  model_cfgs:
    # weight initialization mode
    weight_initialization_mode: "kaiming_uniform"
    # actor type, options: gaussian, gaussian_learning
    actor_type: latent_multi_discrete
#    actor_type: latent_discrete
    # latent size of shared recurrent (GRU) network
#    latent_size: 256
#    latent_size: 128
    latent_size: 64
#    latent_size: 32
#    latent_size: 16
    # number of layers in GRU network
#    num_gru_layers: 2
    num_gru_layers: 1
    # learning rate for gru layers
    gru_lr: 0.0003
#    gru_lr: 0.001
    # linear learning rate decay
    linear_lr_decay: False
    # exploration noise anneal
    exploration_noise_anneal: False
    # std upper bound, and lower bound
    std_range: [0.5, 0.1]
    # Whether disable the no operation action
    disable_no_op: False
    # Whether the first non no-op action is a win, only 1 axis in a multi-discrete action space will be considered
    first_non_no_op_win: True
    # Whether to block backward action for multi-discrete action space, resulting in [3,3,2,3] action space
    block_backward_action: True
    # actor network configurations
    actor:
      # hidden layer sizes
      hidden_sizes: [64, 64]
#      hidden_sizes: [128, 64, 32]
      # activation function
      activation: relu
      # learning rate
      lr: 0.0003
#      lr: 0.001
    critic:
      # hidden layer sizes
#      hidden_sizes: [128, 64, 32]
      hidden_sizes: [64, 64]
      # activation function
      activation: relu
#      activation: sigmoid
      # learning rate
      lr: 0.0003
#      lr: 0.001
    dynamics:
      # hidden layer sizes
      hidden_sizes: [64, 64]
      # activation function
      activation: tanh
      # learning rate
      lr: 0.001
      # lookahead horizon
#      horizon: 3
      horizon: 1
      # Tolerance of costs over lookahead horizon
#      horizon_cost_threshold: 0.2
#      horizon_cost_threshold: 1
#      horizon_cost_threshold: 0.5
      horizon_cost_threshold: 0.3
#      horizon_cost_threshold: 0.8
      # number of sampled trajectories
      traj_sampling_num: 10
      # discount factor for future costs
      discount_factor: 0.95
      # epochs after which sdm-based imagination is engaged
#      engage_after_epochs: 500
#      engage_after_epochs: 400
#      engage_after_epochs: 100
      engage_after_epochs: 150
#      engage_after_epochs: 0
  # lagrangian configurations
  lagrange_cfgs:
    # Tolerance of constraint violation
#    cost_limit: 1.5
#    cost_limit: 1.0
#    cost_limit: 1.2
    cost_limit: 0.5
#    cost_limit: 2.0
#    cost_limit: 2.5
#    cost_limit: 3.0
    # Initial value of lagrangian multiplier
    lagrangian_multiplier_init: 0.001
    # Learning rate of lagrangian multiplier
#    lambda_lr: 0.0035
#    lambda_lr: 0.0003
#    lambda_lr: 0.001
#    lambda_lr: 0.003
    lambda_lr: 0.01
    # Type of lagrangian optimizer
    lambda_optimizer: "Adam"
    # The upper bound of lagrange multiplier
#    lagrangian_upper_bound: 4.0
    lagrangian_upper_bound: 2.0
#    lagrangian_upper_bound: 1.0

